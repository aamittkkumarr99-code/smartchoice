<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SmartChoice Admin</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f4f6fb;
      color: #182033;
    }

    .admin-header {
      background: #14213d;
      color: white;
      padding: 18px 5%;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .admin-header h1 {
      font-size: 22px;
    }

    .admin-header a {
      color: white;
      text-decoration: none;
    }

    .admin-layout {
      display: flex;
      min-height: calc(100vh - 60px);
    }

    .sidebar {
      width: 230px;
      background: white;
      padding: 25px 15px;
      border-right: 1px solid #e1e5ee;
    }

    .sidebar button {
      width: 100%;
      padding: 13px;
      margin-bottom: 8px;
      border: 0;
      background: transparent;
      text-align: left;
      border-radius: 8px;
      cursor: pointer;
      font-size: 15px;
    }

    .sidebar button:hover,
    .sidebar button.active {
      background: #eeeaff;
      color: #5548ed;
    }

    .admin-content {
      flex: 1;
      padding: 30px;
    }

    .section {
      display: none;
    }

    .section.active {
      display: block;
    }

    .section h2 {
      margin-bottom: 20px;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;
    }

    .card {
      background: white;
      padding: 22px;
      border-radius: 14px;
      border: 1px solid #e5e8f0;
    }

    .card h3 {
      margin-bottom: 10px;
    }

    .card p {
      color: #69758a;
    }

    .form-box {
      background: white;
      padding: 25px;
      border-radius: 14px;
      max-width: 700px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-group label {
      display: block;
      margin-bottom: 7px;
      font-weight: 600;
    }

    .form-group input,
    .form-group textarea,
    .form-group select {
      width: 100%;
      padding: 12px;
      border: 1px solid #d9deea;
      border-radius: 8px;
      outline: none;
    }

    .save-btn {
      padding: 12px 22px;
      border: 0;
      border-radius: 8px;
      background: #5548ed;
      color: white;
      font-weight: 700;
      cursor: pointer;
    }

    .save-btn:hover {
      opacity: .9;
    }

    @media (max-width: 700px) {
      .admin-layout {
        display: block;
      }

      .sidebar {
        width: 100%;
        border-right: 0;
        border-bottom: 1px solid #e1e5ee;
      }

      .cards {
        grid-template-columns: 1fr;
      }

      .admin-content {
        padding: 20px;
      }
    }
  </style>
</head>

<body>

  <header class="admin-header">
    <h1>SmartChoice Admin</h1>
    <a href="index.html">View Website →</a>
  </header>

  <div class="admin-layout">

    <aside class="sidebar">
      <button class="active" onclick="showSection('dashboard', this)">📊 Dashboard</button>
      <button onclick="showSection('products', this)">📦 Products</button>
      <button onclick="showSection('categories', this)">🏷️ Categories</button>
      <button onclick="showSection('homepage', this)">🏠 Homepage</button>
      <button onclick="showSection('settings', this)">⚙️ Site Settings</button>
    </aside>

    <main class="admin-content">

      <section id="dashboard" class="section active">
        <h2>Dashboard</h2>

        <div class="cards">
          <div class="card">
            <h3>Products</h3>
            <p>5 products currently listed</p>
          </div>

          <div class="card">
            <h3>Categories</h3>
            <p>5 product categories</p>
          </div>

          <div class="card">
            <h3>Website Status</h3>
            <p>SmartChoice is online</p>
          </div>
        </div>
      </section>

      <section id="products" class="section">
        <h2>Manage Products</h2>

        <div class="form-box">
          <div class="form-group">
            <label>Product Name</label>
            <input type="text" placeholder="Enter product name">
          </div>

          <div class="form-group">
            <label>Price</label>
            <input type="text" placeholder="₹79,900">
          </div>

          <div class="form-group">
            <label>Category</label>
            <select>
              <option>Mobile</option>
              <option>Tech</option>
              <option>Audio</option>
              <option>Wearable</option>
              <option>Fashion</option>
            </select>
          </div>

          <div class="form-group">
            <label>Product Link</label>
            <input type="url" placeholder="Product URL">
          </div>

          <button class="save-btn" onclick="saveMessage()">Save Product</button>
        </div>
      </section>

      <section id="categories" class="section">
        <h2>Manage Categories</h2>

        <div class="form-box">
          <div class="form-group">
            <label>Category Name</label>
            <input type="text" placeholder="New category">
          </div>

          <button class="save-btn" onclick="saveMessage()">Save Category</button>
        </div>
      </section>

      <section id="homepage" class="section">
        <h2>Homepage Settings</h2>

        <div class="form-box">
          <div class="form-group">
            <label>Hero Heading</label>
            <input type="text" value="Smart Choices. Better Shopping.">
          </div>

          <div class="form-group">
            <label>Hero Description</label>
            <textarea rows="4">Discover products worth buying with SmartChoice.</textarea>
          </div>

          <button class="save-btn" onclick="saveMessage()">Save Homepage</button>
        </div>
      </section>

      <section id="settings" class="section">
        <h2>Site Settings</h2>

        <div class="form-box">
          <div class="form-group">
            <label>Website Name</label>
            <input type="text" value="SmartChoice">
          </div>

          <div class="form-group">
            <label>Website Description</label>
            <textarea rows="4">Smart product discovery website.</textarea>
          </div>

          <button class="save-btn" onclick="saveMessage()">Save Settings</button>
        </div>
      </section>

    </main>
  </div>

  <script>
    function showSection(id, button) {
      document.querySelectorAll(".section").forEach(section => {
        section.classList.remove("active");
      });

      document.getElementById(id).classList.add("active");

      document.querySelectorAll(".sidebar button").forEach(btn => {
        btn.classList.remove("active");
      });

      button.classList.add("active");
    }

    function saveMessage() {
      alert("Settings saved successfully.");
    }
  </script>

</body>
</html>
